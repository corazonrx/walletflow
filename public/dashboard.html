<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WalletFlow Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="dashboard">
        <header class="dashboard-header">
          <div>
            <p class="small-label">WalletFlow</p>
            <h2 id="welcomeTitle">Dashboard</h2>
          </div>
          <button id="logoutButton" class="outline-button">Logout</button>
        </header>

        <section class="balance-panel">
          <div>
            <span>Total Balance</span>
            <strong id="balanceTotal">$0.00</strong>
          </div>

          <div class="currency-box">
            <span>Live exchange rate</span>
            <strong id="convertedBalance">-</strong>
            <select id="currencySelect">
              <option value="">Currency</option>
              <option value="EUR">EUR</option>
              <option value="PLN">PLN</option>
              <option value="UAH">UAH</option>
              <option value="GBP">GBP</option>
            </select>
          </div>
        </section>

        <section class="stats-grid">
          <article class="stat-card">
            <span>Income</span>
            <strong id="incomeTotal">$0.00</strong>
          </article>

          <article class="stat-card">
            <span>Expenses</span>
            <strong id="expenseTotal">$0.00</strong>
          </article>

          <article class="stat-card">
            <span>Transactions</span>
            <strong id="transactionCount">0</strong>
          </article>
        </section>

        <section class="main-grid">
          <article class="panel">
            <h3>Add Transaction</h3>

            <form id="transactionForm" class="transaction-form">
              <select id="transactionType" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>

              <input id="transactionAmount" type="number" step="0.01" placeholder="Amount" required />
              <input id="transactionCategory" type="text" placeholder="Category" required />
              <input id="transactionDate" type="date" required />
              <input id="transactionNote" type="text" placeholder="Note" />

              <button type="submit" class="main-button">Add</button>
            </form>

            <p id="transactionMessage" class="message"></p>
          </article>

          <article class="panel">
            <div class="panel-title">
              <h3>Recent Transactions</h3>
            </div>

            <div id="transactionList" class="transaction-list"></div>
          </article>
        </section>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
