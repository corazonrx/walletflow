<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WalletFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="welcome-screen">
        <div class="welcome-left">
          <p class="small-label">WalletFlow Finance Dashboard</p>
          <h1>You are welcome</h1>
          <p class="welcome-text">
            Hit zero once, and it might be 36 apartments instead of one.
          </p>
        </div>

        <div class="login-card">
          <div class="logo-row">
            <div class="logo-mark">$</div>
            <div>
              <h2>WalletFlow</h2>
              <p id="authSubtitle">Secure personal finance tracker</p>
            </div>
          </div>

          <form id="loginForm" class="form-box">
            <label>Email</label>
            <input id="loginEmail" type="email" placeholder="Enter your email" required />

            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="Enter your password" required />

            <button type="submit" class="main-button">Login</button>
          </form>

          <form id="registerForm" class="form-box hidden">
            <label>Name</label>
            <input id="registerName" type="text" placeholder="Your name" required />

            <label>Email</label>
            <input id="registerEmail" type="email" placeholder="Your email" required />

            <label>Password</label>
            <input id="registerPassword" type="password" placeholder="Create password" required />

            <button type="submit" class="main-button">Create account</button>
          </form>

          <button id="authSwitchButton" class="outline-button" type="button">
            Create account
          </button>

          <p id="authMessage" class="message"></p>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
